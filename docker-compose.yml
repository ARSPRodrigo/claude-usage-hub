services:
  server:
    build: .
    image: claude-usage-hub:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    env_file:
      - .env

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - server

volumes:
  data:
    driver: local
