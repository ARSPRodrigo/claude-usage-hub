name: Build Windows collector.exe

# Produces a self-contained Windows collector.exe via Node SEA. Runs on
# tag push (uploads to GitHub Release) or on manual dispatch (uploads as
# a workflow artifact for manual testing).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # required by softprops/action-gh-release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version is read from packageManager in root package.json
        # (pnpm/action-setup errors if both are specified).
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 20.12+ has stable SEA support; 22 is the current LTS at time of writing
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        # collector's bundle.cjs imports from @claude-usage-hub/shared, which is a
        # TypeScript workspace package. esbuild can't resolve it until shared's
        # dist/index.js has been emitted by tsc.
        run: pnpm --filter @claude-usage-hub/shared build

      - name: Build collector.exe
        working-directory: packages/collector
        run: pwsh -File build-sea.ps1

      - name: Smoke test (--version)
        working-directory: packages/collector
        run: ./dist/collector.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: collector-exe
          path: packages/collector/dist/collector.exe
          retention-days: 30

      - name: Detect pre-release (alpha/beta/rc tags)
        if: startsWith(github.ref, 'refs/tags/')
        id: prerelease
        shell: bash
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/collector/dist/collector.exe
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          # Release body comes from RELEASE_NOTES.md, refreshed per release.
          # Without this the release publishes with an empty description.
          body_path: RELEASE_NOTES.md
